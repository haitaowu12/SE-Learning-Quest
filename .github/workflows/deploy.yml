name: Validate and publish SE Learning Quest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the explicitly accepted commit after all validation passes'
        type: boolean
        required: false
        default: false
      approved_sha:
        description: 'Full 40-character main commit accepted for publication; required when publish is true'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run curriculum -- --check
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-${{ matrix.browser }}
          path: |
            test-results/
            output/asterfall/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Verify explicit publication request
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/verify-publication-request.mjs
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish static game
        id: deployment
        uses: actions/deploy-pages@v4
